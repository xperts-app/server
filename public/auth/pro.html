<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root{
            --primary-blue:#0066ff;
            --background-color:#F2F6FC;
            --text-dark:#1d2c3c;
            --text-light:#5a6b7d;
            --border-color:#F2F6FC;
        }

        body{
            font-family:'Poppins',sans-serif;
            background-color:var(--background-color);
            margin:0;
            padding-top:5vh;
            font-size:25px;   /* default size */
            color:var(--text-dark); /* default text color */
        }

        .main-container{
            max-width:480px;
            margin:auto;
            padding:20px;
            text-align:center;
        }

        .illustration{
            width:150px;
            height:150px;
            margin:0 auto 20px auto;
        }

        h2{
            font-weight:600;
            font-size:28px;
            margin-bottom:30px;
        }

        .profile-details{
            background-color:#F2F6FC;
            border-radius:16px;
            padding:20px 30px;
            text-align:left;
            box-shadow:0 8px 30px rgba(0,0,0,0.05);
        }

        .detail-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 0;
            border-bottom:1px solid var(--border-color);
        }

        .detail-item:last-child{
            border-bottom:none;
        }

        .detail-item .label{
            font-weight:500;
            font-size:inherit;
        }

        .detail-item .value{
            font-weight:600;
            font-size:inherit;
        }

        .actions{
            margin-top:30px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .btn{
            padding:16px;
            border-radius:12px;
            font-size:inherit;
            font-weight:600;
            text-decoration:none;
            display:block;
            transition:all .3s;
        }

        .btn-primary{
            background-color:var(--primary-blue);
            color:#F2F6FC;
        }

        .btn-primary:hover{
            background-color:#dbe2ea;
        }

        .btn-secondary{
            background-color:#F2F6FC;
            color:var(--text-light);
            border:1px solid #dbe2ea;
        }

        .btn-secondary:hover{
            background-color:#e6ecf5;
        }
    </style>
</head>
<body>
    <div class="main-container" id="profile-container">
        <!-- SVG Illustration -->
        <svg class="illustration" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><g><path d="M75 131.8c-20.4 0-39-9.5-51.1-25.5 12.3-15.8 31-25.6 51.1-25.6s38.8 9.8 51.1 25.6c-12.1 16-30.7 25.5-51.1 25.5z" fill="#34c1a5"></path><path d="M75 18.2c-15.6 0-28.2 12.6-28.2 28.2s12.6 28.2 28.2 28.2 28.2-12.6 28.2-28.2-12.6-28.2-28.2-28.2z" fill="#ffc157"></path><path d="M103.2 46.4c0 15.6-12.6 28.2-28.2 28.2V18.2c15.6 0 28.2 12.6 28.2 28.2z" fill="#ffab2f"></path><path d="M103.2 106.3c-12.3-15.8-31-25.6-51.1-25.6v51.1C72.5 131.8 90.9 122.3 103.2 106.3z" fill="#2ca98e"></path></g></svg>
        
        <h2 id="greeting">Hi, Vinayak!</h2>

        <div class="profile-details">
            <div class="detail-item"><span class="value" id="name-display">Vinayak Nigam </span></div>
            <div class="detail-item"><span class="value" id="mobile-display">8005811475</span></div>
            <div class="detail-item"><span class="value" id="email-display">nigambhawna02@gmail.com</span></div>
            <div class="detail-item"><span class="value" id="class-display">11 NEET NEET</span></div>
        </div>

        <div class="actions">
            <a href="5.html" class="btn btn-primary">Edit Profile</a>
            <a href="#" id="logout-btn" class="btn btn-secondary">Logout</a>
        </div>
    </div>

    <script>
        // Utility function to get query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Get values from URL parameters
            const fontSize = getQueryParam('size');   // e.g. "18px"
            const textColor = getQueryParam('colour'); // e.g. "#000000"

            // Apply font size to body
            if (fontSize) {
                document.body.style.fontSize = fontSize;
            }

            // Apply text color to body
            if (textColor) {
                document.body.style.color = textColor;
            }
        });
    </script>
</body>
</html>
