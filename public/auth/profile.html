<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - ALLEN Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1d2c3c;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #e0e6ed;
      border-radius: 12px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .section-header h3 {
      margin: 0;
      font-size: 16px;
    }
    .edit-btn {
      color: #0066ff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .field {
      margin: 8px 0;
    }
    .field strong {
      display: inline-block;
      width: 120px;
      font-weight: 500;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: flex-end;
    }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
    }
    .modal h3 {
      margin-top: 0;
    }
    .modal input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 15px;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn.cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn.save {
      background: #0066ff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Personal Details</h2>

    <div class="section">
      <div class="section-header">
        <h3>Contact Details</h3>
        <span class="edit-btn" onclick="openEdit('contact')">Edit</span>
      </div>
      <div class="field"><strong>Phone Number:</strong> <span id="phone-display"></span></div>
      <div class="field"><strong>Email:</strong> <span id="email-display"></span></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h3>Student Details</h3>
        <span class="edit-btn" onclick="openEdit('student')">Edit</span>
      </div>
      <div class="field"><strong>Gender:</strong> <span id="gender-display"></span></div>
      <div class="field"><strong>Blood Group:</strong> <span id="blood-display"></span></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="edit-modal">
    <div class="modal-content">
      <h3 id="modal-title">Edit</h3>
      <form id="edit-form">
        <div id="edit-fields"></div>
        <div class="modal-actions">
          <button type="button" class="btn cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-ers6CRuH8bCFomXJHuLxPWff-Xa4ZVk",
      authDomain: "xperts-data.firebaseapp.com",
      projectId: "xperts-data",
      storageBucket: "xperts-data.firebasestorage.app",
      messagingSenderId: "934675149024",
      appId: "1:934675149024:web:23486a5f38f65f103ce085"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = localStorage.getItem('loggedInUserId');
    let currentUserData = {};

    async function loadProfile() {
      if (!userId) return window.location.href = "login.html";
      const doc = await db.collection("users").doc(userId).get();
      if (!doc.exists) return alert("User not found");
      currentUserData = doc.data();

      document.getElementById("phone-display").innerText = currentUserData.mobileNumber || "";
      document.getElementById("email-display").innerText = currentUserData.email || "";
      document.getElementById("gender-display").innerText = currentUserData.gender || "";
      document.getElementById("blood-display").innerText = currentUserData.bloodGroup || "";
    }

    function openEdit(type) {
      const modal = document.getElementById("edit-modal");
      const fields = document.getElementById("edit-fields");
      const title = document.getElementById("modal-title");
      fields.innerHTML = "";
      
      if (type === "contact") {
        title.innerText = "Edit Contact Details";
        fields.innerHTML = `
          <label>Phone Number</label>
          <input type="text" id="edit-phone" value="${currentUserData.mobileNumber || ''}">
          <label>Email</label>
          <input type="email" id="edit-email" value="${currentUserData.email || ''}">
        `;
      } else if (type === "student") {
        title.innerText = "Edit Student Details";
        fields.innerHTML = `
          <label>Gender</label>
          <input type="text" id="edit-gender" value="${currentUserData.gender || ''}">
          <label>Blood Group</label>
          <input type="text" id="edit-blood" value="${currentUserData.bloodGroup || ''}">
        `;
      }

      modal.style.display = "flex";

      document.getElementById("edit-form").onsubmit = async (e) => {
        e.preventDefault();
        let updates = {};
        if (type === "contact") {
          updates.mobileNumber = document.getElementById("edit-phone").value;
          updates.email = document.getElementById("edit-email").value;
        } else if (type === "student") {
          updates.gender = document.getElementById("edit-gender").value;
          updates.bloodGroup = document.getElementById("edit-blood").value;
        }
        await db.collection("users").doc(userId).update(updates);
        closeModal();
        loadProfile();
      };
    }

    function closeModal() {
      document.getElementById("edit-modal").style.display = "none";
    }

    loadProfile();
  </script>
</body>
</html>
