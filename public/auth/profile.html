<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f0f4f9; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #fff; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1d2c3c; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0066ff; color: #fff; }
    .btn-danger { background: #e63946; color: #fff; margin-top: 10px; }
    .status { margin-top: 1rem; font-weight: 500; min-height: 1.2em; }
    .success { color: #34a853; }
    .error { color: #e63946; }
  </style>
</head>
<body>
  <div class="container">
    <h2>My Profile</h2>
    <form id="profile-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" maxlength="10" required>
      </div>
      <div class="form-group">
        <label for="password">Password (leave blank to keep unchanged)</label>
        <input type="password" id="password">
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
    <button id="logout-btn" class="btn btn-danger">Logout</button>
    <div id="status" class="status"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-ers6CRuH8bCFomXJHuLxPWff-Xa4ZVk",
      authDomain: "xperts-data.firebaseapp.com",
      projectId: "xperts-data",
      storageBucket: "xperts-data.firebasestorage.app",
      messagingSenderId: "934675149024",
      appId: "1:934675149024:web:23486a5f38f65f103ce085",
      measurementId: "G-6TS06NTDZQ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const fullNameInput = document.getElementById('fullName');
    const mobileInput = document.getElementById('mobileNumber');
    const passwordInput = document.getElementById('password');
    const statusMsg = document.getElementById('status');
    const logoutBtn = document.getElementById('logout-btn');

    const userId = localStorage.getItem('loggedInUserId');
    if (!userId) {
      window.location.href = "index.html"; // back to login
    }

    async function loadProfile() {
      try {
        const doc = await db.collection('users').doc(userId).get();
        if (!doc.exists) { throw new Error("User not found"); }
        const data = doc.data();
        fullNameInput.value = data.fullName || '';
        mobileInput.value = data.mobileNumber || '';
      } catch (err) {
        console.error(err);
        statusMsg.textContent = "Error loading profile.";
        statusMsg.className = "status error";
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.textContent = "Saving...";
      statusMsg.className = "status";

      const updates = {
        fullName: fullNameInput.value.trim(),
        mobileNumber: mobileInput.value.trim()
      };
      if (passwordInput.value.trim()) {
        updates.password = passwordInput.value.trim();
      }

      try {
        await db.collection('users').doc(userId).update(updates);
        localStorage.setItem('loggedInUserName', updates.fullName);
        statusMsg.textContent = "Profile updated successfully.";
        statusMsg.className = "status success";
        passwordInput.value = "";
      } catch (err) {
        console.error(err);
        statusMsg.textContent = "Error updating profile.";
        statusMsg.className = "status error";
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      window.location.href = "index.html";
    });

    loadProfile();
  </script>
</body>
</html>
