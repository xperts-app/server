<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: transparent;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #feedback {
      font-size: 20px;
      font-weight: 600;
      color: #1d2c3c;
      white-space: nowrap; /* always single line */
    }
    .great { color: green; }
    .better { color: #28a745; }
    .average { color: #ff9800; }
    .poor { color: red; }
  </style>
</head>
<body>
  <div id="feedback">Loading...</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = { 
      apiKey: "AIzaSyD-ers6CRuH8bCFomXJHuLxPWff-Xa4ZVk", 
      authDomain: "xperts-data.firebaseapp.com", 
      projectId: "xperts-data", 
      storageBucket: "xperts-data.firebasestorage.app", 
      messagingSenderId: "934675149024", 
      appId: "1:934675149024:web:23486a5f38f65f103ce085" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = localStorage.getItem("loggedInUserId");
    const feedbackDiv = document.getElementById("feedback");

    async function loadMarks() {
      if (!userId) {
        feedbackDiv.textContent = "Not logged in.";
        return;
      }
      try {
        const snapshot = await db.collection("tests").orderBy("testDate", "asc").get();
        let marks = [];

        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.results && data.results[userId]) {
            const result = data.results[userId];
            if (result.status === "Present") {
              marks.push(result.totalMarks || 0);
            }
          }
        });

        if (marks.length === 0) {
          feedbackDiv.textContent = "No marks yet.";
          return;
        }

        let latest = marks[marks.length - 1]; // last test score
        let maxMarks = 100; // adjust if your tests have diff max marks
        let percentage = (latest / maxMarks) * 100;

        // Detect trend
        let improving = true;
        let declining = true;
        for (let i = 1; i < marks.length; i++) {
          if (marks[i] < marks[i - 1]) improving = false;
          if (marks[i] > marks[i - 1]) declining = false;
        }

        // Feedback by latest performance
        if (percentage < 40) {
          feedbackDiv.textContent = "Doing Not Well!";
          feedbackDiv.className = "poor";
        } else if (percentage < 60) {
          feedbackDiv.textContent = "Doing Average!";
          feedbackDiv.className = "average";
        } else if (percentage < 80) {
          feedbackDiv.textContent = "Doing Slightly Better!";
          feedbackDiv.className = "better";
        } else {
          feedbackDiv.textContent = "Doing Great!";
          feedbackDiv.className = "great";
        }

      } catch (err) {
        console.error(err);
        feedbackDiv.textContent = "Error loading feedback.";
      }
    }

    loadMarks();
  </script>
</body>
</html>
